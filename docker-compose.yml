services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolu}
      POSTGRES_DB: ${POSTGRES_DB:-kolu_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kolu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kolu} -d ${POSTGRES_DB:-kolu_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kolu_postgres_data:
